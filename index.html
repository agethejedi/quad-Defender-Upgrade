<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quad Turret Prototype</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="top left">
        <div class="label">SCORE</div><div id="score" class="big">0</div>
        <div class="label green">KILLS</div><div id="kills" class="big green">0 / 5</div>
      </div>
      <div class="top right">
        <div class="label">WAVE</div><div id="wave" class="big">1 / 3</div>
      </div>
      <div id="bossHud" class="boss hidden"><div>BOSS</div><div class="bar"><span id="bossBar"></span></div></div>
      <div id="reticle"><span></span></div>
      <div class="dash">
        <div class="panel"><div class="label green">SHIELD</div><div id="shieldPct" class="big green">100%</div><div id="hits">0 / 30 hits</div></div>
        <div class="shieldDome"></div>
        <div class="panel"><div class="label green">ROUND</div><div id="round" class="big green">1</div><div id="objective">Destroy 5 enemies</div></div>
      </div>
      <div id="message">Move mouse/touch to aim • Click/tap to fire • R to restart</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
