<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quad Turret — Space Shooter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <script type="module" src="./main.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">

    <!-- ── TOP LEFT: Score + Kills ── -->
    <div class="corner top-left">
      <div class="stat-label">SCORE</div>
      <div id="score" class="stat-value">0</div>
      <div class="stat-label green" style="margin-top:10px">KILLS</div>
      <div id="kills" class="stat-value green">0 / 5</div>
    </div>

    <!-- ── TOP RIGHT: Wave ── -->
    <div class="corner top-right">
      <div class="stat-label">WAVE</div>
      <div id="wave" class="stat-value">1 / 3</div>
    </div>

    <!-- ── BOSS BAR (center top) ── -->
    <div id="bossHud" class="boss-bar hidden">
      <div class="boss-label">BOSS</div>
      <div class="boss-track"><span id="bossBar"></span></div>
    </div>

    <!-- ── RETICLE ── -->
    <div id="reticle"><span></span></div>

    <!-- ── COMBO ── -->
    <div id="combo"></div>

    <!-- ── BOTTOM DASHBOARD ── -->
    <div class="dash">

      <!-- Left panel: Shield -->
      <div class="panel panel-left">
        <div class="stat-label green">SHIELD</div>
        <div id="shieldPct" class="stat-value green large">100%</div>
        <div class="shield-icon">🛡</div>
        <div class="shield-track">
          <div class="shield-fill" id="shieldBar"></div>
        </div>
      </div>

      <!-- Center: dome + hits taken -->
      <div class="dash-center">
        <div class="dome-wrap">
          <div class="shieldDome"></div>
        </div>
        <div class="hits-row">
          <div class="stat-label green" style="font-size:11px; margin-bottom:2px">HITS TAKEN</div>
          <div id="hits" class="stat-value green" style="font-size:28px">0 / 30</div>
        </div>
      </div>

      <!-- Right panel: Round + Objective -->
      <div class="panel panel-right">
        <div class="stat-label green">ROUND</div>
        <div id="round" class="stat-value green large">1</div>
        <div class="obj-label">OBJECTIVE</div>
        <div id="objective" class="obj-text">Destroy 5 Enemies<br>Then Boss</div>
      </div>

    </div>

    <!-- bottom hint -->
    <div id="message">Move to aim &nbsp;·&nbsp; Click / <kbd>Space</kbd> to fire &nbsp;·&nbsp; <kbd>R</kbd> to restart</div>

  </div>
</body>
</html>
